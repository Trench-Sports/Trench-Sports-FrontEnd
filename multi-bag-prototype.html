<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Multi-Bag Matrix — Trench Sports</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #0a0a0d;
    --panel:        #131318;
    --panel-border: rgba(255,255,255,0.08);
    --muted:        rgba(255,255,255,0.40);
    --accent:       #b400ff;
    --seam:         2px;          /* dark gutter between panes */
  }

  body {
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    min-height: 100vh;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Page shell ── */
  .page {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ── Top chrome ── */
  .top-chrome {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    background: rgba(10,10,13,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 10;
  }

  .chrome-logo {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(180,0,255,0.55);
    white-space: nowrap;
  }

  .chrome-divider {
    width: 1px;
    height: 20px;
    background: var(--panel-border);
    flex-shrink: 0;
  }

  /* ── Mode strip ── */
  .mode-strip {
    display: flex;
    gap: 6px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .mode-strip::-webkit-scrollbar { display: none; }

  .mode-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 12px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 180ms ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .mode-chip.active { color: #fff; }
  .mode-chip[data-mode="Power"].active    { background:rgba(180,0,255,0.18); border-color:rgba(180,0,255,0.55); box-shadow:0 0 14px -4px rgba(180,0,255,0.50); color:#b400ff; }
  .mode-chip[data-mode="Accuracy"].active { background:rgba(0,220,255,0.18); border-color:rgba(0,220,255,0.55); box-shadow:0 0 14px -4px rgba(0,220,255,0.50); color:#00dcff; }
  .mode-chip[data-mode="Reaction"].active { background:rgba(255,200,0,0.18); border-color:rgba(255,200,0,0.55); box-shadow:0 0 14px -4px rgba(255,200,0,0.50); color:#ffcc00; }
  .mode-chip[data-mode="Volume"].active   { background:rgba(255,106,0,0.18); border-color:rgba(255,106,0,0.55); box-shadow:0 0 14px -4px rgba(255,106,0,0.50); color:#ff6a00; }
  .mode-chip[data-mode="Target"].active   { background:rgba(0,255,136,0.18); border-color:rgba(0,255,136,0.55); box-shadow:0 0 14px -4px rgba(0,255,136,0.50); color:#00ff88; }

  /* ── Global start/stop ── */
  .global-btn {
    flex-shrink: 0;
    height: 36px;
    padding: 0 18px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 180ms ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .global-btn.start { background: linear-gradient(135deg, rgba(180,0,255,0.85), rgba(140,0,210,0.85)); color:#fff; box-shadow:0 0 20px -4px rgba(180,0,255,0.55); }
  .global-btn.stop  { background: rgba(255,80,80,0.18); border:1px solid rgba(255,80,80,0.45); color:#ff8080; }
  .global-btn:active { transform: scale(0.96); }

  /* ── Bag count row ── */
  .bag-count-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--panel-border);
    background: rgba(10,10,13,0.95);
    z-index: 10;
  }
  .bag-count-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .bag-count-chips { display: flex; gap: 5px; }
  .count-chip {
    width: 28px; height: 28px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.50);
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 140ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .count-chip.active { background:rgba(180,0,255,0.18); border-color:rgba(180,0,255,0.55); color:#b400ff; }

  /* ── Split-screen container ── */
  /* Full bleed — no padding, no scrollbar, fills remaining height */
  .split-screen {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);  /* seam color bleeds through gaps */
  }

  /* ── Bag pane (absolute, gaming-split positioned) ── */
  .bag-pane {
    position: absolute;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow 300ms ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* Subtle tinted backgrounds per bag */
  .bag-pane[data-bag="1"] { background: #0e0814; }
  .bag-pane[data-bag="2"] { background: #071015; }
  .bag-pane[data-bag="3"] { background: #0f0d00; }
  .bag-pane[data-bag="4"] { background: #100800; }
  .bag-pane[data-bag="5"] { background: #001208; }

  /* Active session inner glow */
  .bag-pane.session-active[data-bag="1"] { box-shadow: inset 0 0 60px -20px rgba(180,0,255,0.18); }
  .bag-pane.session-active[data-bag="2"] { box-shadow: inset 0 0 60px -20px rgba(0,220,255,0.18); }
  .bag-pane.session-active[data-bag="3"] { box-shadow: inset 0 0 60px -20px rgba(255,200,0,0.18); }
  .bag-pane.session-active[data-bag="4"] { box-shadow: inset 0 0 60px -20px rgba(255,106,0,0.18); }
  .bag-pane.session-active[data-bag="5"] { box-shadow: inset 0 0 60px -20px rgba(0,255,136,0.18); }

  /* ── Pane header ── */
  .pane-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px 7px;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
    position: relative;
    z-index: 4;
  }

  .bag-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .bag-pane[data-bag="1"] .bag-dot { background:#b400ff; box-shadow:0 0 7px 2px rgba(180,0,255,0.65); }
  .bag-pane[data-bag="2"] .bag-dot { background:#00dcff; box-shadow:0 0 7px 2px rgba(0,220,255,0.65); }
  .bag-pane[data-bag="3"] .bag-dot { background:#ffcc00; box-shadow:0 0 7px 2px rgba(255,200,0,0.65); }
  .bag-pane[data-bag="4"] .bag-dot { background:#ff6a00; box-shadow:0 0 7px 2px rgba(255,106,0,0.65); }
  .bag-pane[data-bag="5"] .bag-dot { background:#00ff88; box-shadow:0 0 7px 2px rgba(0,255,136,0.65); }

  .bag-label {
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }
  .bag-pane[data-bag="1"] .bag-label { color:#b400ff; }
  .bag-pane[data-bag="2"] .bag-label { color:#00dcff; }
  .bag-pane[data-bag="3"] .bag-label { color:#ffcc00; }
  .bag-pane[data-bag="4"] .bag-label { color:#ff6a00; }
  .bag-pane[data-bag="5"] .bag-label { color:#00ff88; }

  /* ── Live pulse ── */
  @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.30} }
  .live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 5px 2px rgba(0,255,136,0.55);
    animation: livePulse 1.1s ease-in-out infinite;
    flex-shrink: 0;
  }

  /* ── Athlete chip ── */
  .athlete-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px 2px 4px;
    border-radius: 20px;
    border: 1px dashed rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.35);
    cursor: pointer;
    transition: all 150ms ease;
    -webkit-tap-highlight-color: transparent;
    margin-left: auto;
    user-select: none;
    flex-shrink: 0;
  }
  .athlete-chip:hover { border-color:rgba(255,255,255,0.35); background:rgba(0,0,0,0.55); }
  .athlete-chip.assigned { border-style: solid; }
  .bag-pane[data-bag="1"] .athlete-chip.assigned { border-color:rgba(180,0,255,0.50); background:rgba(180,0,255,0.12); }
  .bag-pane[data-bag="2"] .athlete-chip.assigned { border-color:rgba(0,220,255,0.50); background:rgba(0,220,255,0.12); }
  .bag-pane[data-bag="3"] .athlete-chip.assigned { border-color:rgba(255,200,0,0.50); background:rgba(255,200,0,0.12); }
  .bag-pane[data-bag="4"] .athlete-chip.assigned { border-color:rgba(255,106,0,0.50); background:rgba(255,106,0,0.12); }
  .bag-pane[data-bag="5"] .athlete-chip.assigned { border-color:rgba(0,255,136,0.50); background:rgba(0,255,136,0.12); }

  .athlete-avatar {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; font-weight: 800;
    background: rgba(180,0,255,0.25);
    color: rgba(210,140,255,1);
    border: 1px solid rgba(180,0,255,0.35);
    flex-shrink: 0;
  }
  .athlete-name { font-size: 10px; font-weight: 600; color:rgba(255,255,255,0.80); white-space:nowrap; }
  .assign-icon  { font-size: 9px; color:var(--muted); }

  /* ── Stat strip ── */
  .stat-strip {
    flex-shrink: 0;
    display: flex;
    gap: 4px;
    padding: 0 10px 8px;
  }
  .stat-pill {
    flex: 1;
    height: 30px;
    border-radius: 6px;
    background: rgba(0,0,0,0.40);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .stat-label { font-size: 7px; font-weight: 700; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
  .stat-value { font-size: 12px; font-weight: 800; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .bag-pane[data-bag="1"] .stat-value { color:#b400ff; }
  .bag-pane[data-bag="2"] .stat-value { color:#00dcff; }
  .bag-pane[data-bag="3"] .stat-value { color:#ffcc00; }
  .bag-pane[data-bag="4"] .stat-value { color:#ff6a00; }
  .bag-pane[data-bag="5"] .stat-value { color:#00ff88; }

  /* ── Hit matrix ── */
  .matrix-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    margin: 0 8px 8px;
    border-radius: 6px;
  }
  .hit-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(12, 1fr);
    gap: 2px;
    padding: 3px;
  }
  .hit-cell {
    border-radius: 2px;
    background: rgba(255,255,255,0.03);
    transition: background 150ms ease, box-shadow 150ms ease;
  }

  /* Enlarge hint — bottom-right corner of each pane */
  .enlarge-btn {
    position: absolute;
    bottom: 14px; right: 14px;
    width: 22px; height: 22px;
    border-radius: 5px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 160ms;
    pointer-events: none;
    z-index: 5;
  }
  .bag-pane:hover .enlarge-btn { opacity: 0.70; }

  /* ── Athlete picker sheet ── */
  .athlete-picker {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: flex-end;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 220ms ease;
  }
  .athlete-picker.open { opacity:1; pointer-events:all; }
  .picker-sheet {
    width: 100%; max-width: 480px;
    margin: 0 auto;
    background: #1a1a22;
    border-radius: 20px 20px 0 0;
    border: 1px solid var(--panel-border);
    border-bottom: none;
    padding: 0 0 env(safe-area-inset-bottom, 16px);
    transform: translateY(100%);
    transition: transform 280ms cubic-bezier(.25,.46,.45,.94);
  }
  .athlete-picker.open .picker-sheet { transform: translateY(0); }
  .picker-handle { width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,0.18); margin:10px auto 14px; }
  .picker-title  { font-size:14px; font-weight:800; text-align:center; margin-bottom:4px; padding:0 16px; }
  .picker-subtitle { font-size:11px; color:var(--muted); text-align:center; margin-bottom:14px; }
  .picker-list {
    display: flex; flex-direction: column; gap: 6px;
    padding: 0 12px 16px;
    max-height: 50dvh; overflow-y: auto;
  }
  .picker-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.03);
    cursor: pointer;
    transition: all 140ms ease;
  }
  .picker-row:hover,.picker-row:active { background:rgba(180,0,255,0.10); border-color:rgba(180,0,255,0.35); }
  .picker-row.selected { background:rgba(180,0,255,0.14); border-color:rgba(180,0,255,0.50); }
  .picker-avatar { width:36px; height:36px; border-radius:50%; background:rgba(180,0,255,0.20); border:1px solid rgba(180,0,255,0.30); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:rgba(210,140,255,1); flex-shrink:0; }
  .picker-info { flex:1; min-width:0; }
  .picker-name { font-size:14px; font-weight:600; }
  .picker-meta { font-size:11px; color:var(--muted); margin-top:2px; }
  .picker-check { width:20px; height:20px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:10px; transition:all 140ms ease; }
  .picker-row.selected .picker-check { background:#b400ff; border-color:#b400ff; }
  .picker-unassign { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; border:1px dashed rgba(255,80,80,0.25); background:rgba(255,80,80,0.05); cursor:pointer; color:rgba(255,120,120,0.80); font-size:12px; font-weight:600; margin:0 12px 6px; transition:all 140ms ease; }
  .picker-unassign:hover { background:rgba(255,80,80,0.10); border-color:rgba(255,80,80,0.40); }

  /* ── Expand overlay ── */
  .expand-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 240ms ease;
    padding: 24px;
  }
  .expand-overlay.open { opacity:1; pointer-events:all; }
  .expand-card {
    width: 100%; max-width: 520px; max-height: 90dvh;
    background: var(--panel);
    border-radius: 20px;
    border: 1px solid var(--panel-border);
    overflow: hidden;
    display: flex; flex-direction: column;
    transform: scale(0.92);
    transition: transform 240ms cubic-bezier(.34,1.56,.64,1);
  }
  .expand-overlay.open .expand-card { transform: scale(1); }
  .expand-header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--panel-border); flex-shrink:0; }
  .expand-title  { font-size:15px; font-weight:800; }
  .expand-close  { margin-left:auto; width:28px; height:28px; border-radius:7px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:var(--muted); transition:all 140ms ease; flex-shrink:0; }
  .expand-close:hover { background:rgba(255,80,80,0.15); color:#ff8080; border-color:rgba(255,80,80,0.35); }
  .expand-stats  { display:flex; gap:8px; padding:12px 16px; flex-shrink:0; }
  .expand-stat   { flex:1; height:52px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .expand-stat-label { font-size:9px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .expand-stat-val   { font-size:18px; font-weight:900; font-variant-numeric:tabular-nums; }
  .expand-matrix-wrap { flex:1; position:relative; margin:0 16px 16px; border-radius:12px; background:rgba(0,0,0,0.35); overflow:hidden; }
  .expand-hit-grid { position:absolute; inset:0; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(12,1fr); gap:2.5px; padding:6px; }
  .expand-cell { border-radius:4px; transition:background 150ms ease; }

  /* ── Tablet gate ── */
  .tablet-gate {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 999;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 40px; text-align: center;
  }
  @media (max-width: 599px) { .tablet-gate { display: flex; } }
  .gate-icon  { font-size: 40px; }
  .gate-title { font-size: 20px; font-weight: 800; }
  .gate-sub   { font-size: 13px; color: var(--muted); max-width: 280px; }
</style>
</head>
<body>

<div class="tablet-gate">
  <div class="gate-icon">📱</div>
  <div class="gate-title">Tablet Required</div>
  <div class="gate-sub">Multi-bag mode is only available on tablet screens (600px+)</div>
</div>

<div class="page">

  <!-- Top chrome -->
  <div class="top-chrome">
    <div class="chrome-logo">Trench</div>
    <div class="chrome-divider"></div>
    <div class="mode-strip" id="modeStrip">
      <button class="mode-chip active" data-mode="Power"    onclick="setMode('Power')"   >💥 Power</button>
      <button class="mode-chip"        data-mode="Accuracy" onclick="setMode('Accuracy')" >🎯 Accuracy</button>
      <button class="mode-chip"        data-mode="Reaction" onclick="setMode('Reaction')" >⚡️ Reaction</button>
      <button class="mode-chip"        data-mode="Volume"   onclick="setMode('Volume')"   >🥊 Volume</button>
      <button class="mode-chip"        data-mode="Target"   onclick="setMode('Target')"   >🏹 Target</button>
    </div>
    <button class="global-btn start" id="globalBtn" onclick="toggleSession()">
      <span>▶</span> Start All
    </button>
  </div>

  <!-- Bag count row -->
  <div class="bag-count-row">
    <span class="bag-count-label">Bags connected</span>
    <div class="bag-count-chips">
      <button class="count-chip" onclick="setBagCount(1)">1</button>
      <button class="count-chip" onclick="setBagCount(2)">2</button>
      <button class="count-chip active" onclick="setBagCount(3)">3</button>
      <button class="count-chip" onclick="setBagCount(4)">4</button>
      <button class="count-chip" onclick="setBagCount(5)">5</button>
    </div>
  </div>

  <!-- Split-screen area — full bleed, no padding -->
  <div class="split-screen" id="splitScreen"></div>

</div>

<!-- Athlete picker -->
<div class="athlete-picker" id="athletePicker" onclick="closePickerOnBackdrop(event)">
  <div class="picker-sheet">
    <div class="picker-handle"></div>
    <div class="picker-title" id="pickerTitle">Assign Athlete</div>
    <div class="picker-subtitle">Tap an athlete to assign them to this bag</div>
    <div class="picker-unassign" onclick="unassignAthlete()" id="unassignBtn" style="display:none">✕ Remove athlete from this bag</div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<!-- Expand overlay -->
<div class="expand-overlay" id="expandOverlay" onclick="closeExpandOnBackdrop(event)">
  <div class="expand-card" id="expandCard">
    <div class="expand-header">
      <div class="bag-dot" id="expandDot"></div>
      <div class="expand-title" id="expandTitle">Bag 1</div>
      <div class="live-dot" id="expandLiveDot" style="display:none"></div>
      <div class="expand-close" onclick="closeExpand()">✕</div>
    </div>
    <div class="expand-stats" id="expandStats"></div>
    <div class="expand-matrix-wrap">
      <div class="expand-hit-grid" id="expandGrid"></div>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const NUM_ROWS   = 12;
const NUM_COLS   = 8;
const FADE_TTL   = 500;
const SEAM       = 2;   // px — dark gutter between panes

const ATHLETES = [
  { id:"a1", initials:"MJ", name:"Marcus Johnson",  meta:"WR · Football" },
  { id:"a2", initials:"TW", name:"Tiana Williams",  meta:"LB · Football" },
  { id:"a3", initials:"KR", name:"Kevin Rodriguez", meta:"PG · Basketball" },
  { id:"a4", initials:"SD", name:"Sophia Davis",    meta:"MF · Soccer" },
  { id:"a5", initials:"JT", name:"Jordan Thompson", meta:"SS · Baseball" },
  { id:"a6", initials:"AL", name:"Amara Lewis",     meta:"SF · Basketball" },
];

const BAG_META = {
  1: { color:"#b400ff", glow:"rgba(180,0,255,0.55)", label:"Bag 1" },
  2: { color:"#00dcff", glow:"rgba(0,220,255,0.55)", label:"Bag 2" },
  3: { color:"#ffcc00", glow:"rgba(255,200,0,0.55)", label:"Bag 3" },
  4: { color:"#ff6a00", glow:"rgba(255,106,0,0.55)", label:"Bag 4" },
  5: { color:"#00ff88", glow:"rgba(0,255,136,0.55)", label:"Bag 5" },
};

// ── State ─────────────────────────────────────────────────────────────────────
let currentMode   = "Power";
let bagCount      = 3;
let sessionActive = false;
let pickerTarget  = null;
let expandedBag   = null;
let simTimers     = [];

const bagState = {};
for (let i = 1; i <= 5; i++) {
  bagState[i] = { athlete:null, hits:0, events:0, peakSi:0, grid:new Map() };
}
bagState[1].athlete = ATHLETES[0];
bagState[2].athlete = ATHLETES[1];

// ── Split-screen layout engine ────────────────────────────────────────────────
// Returns an array of {left, top, width, height} in px for each bag,
// accounting for the seam gap between panes.
function getPaneRects(count, totalW, totalH) {
  const S = SEAM;
  switch (count) {
    case 1:
      return [{ left:0, top:0, width:totalW, height:totalH }];

    case 2:
      // Left | Right
      return [
        { left:0,           top:0, width:Math.floor((totalW - S) / 2),                       height:totalH },
        { left:Math.floor((totalW - S) / 2) + S, top:0, width:totalW - Math.floor((totalW - S) / 2) - S, height:totalH },
      ];

    case 3:
      // Top-left | Top-right
      // Bottom (full width)
      const half3W = Math.floor((totalW - S) / 2);
      const half3H = Math.floor((totalH - S) / 2);
      return [
        { left:0,          top:0,          width:half3W,          height:half3H },
        { left:half3W + S, top:0,          width:totalW - half3W - S, height:half3H },
        { left:0,          top:half3H + S, width:totalW,          height:totalH - half3H - S },
      ];

    case 4:
      // 2 × 2
      const half4W = Math.floor((totalW - S) / 2);
      const half4H = Math.floor((totalH - S) / 2);
      return [
        { left:0,          top:0,          width:half4W,              height:half4H },
        { left:half4W + S, top:0,          width:totalW - half4W - S, height:half4H },
        { left:0,          top:half4H + S, width:half4W,              height:totalH - half4H - S },
        { left:half4W + S, top:half4H + S, width:totalW - half4W - S, height:totalH - half4H - S },
      ];

    case 5:
      // Top row: 3 equal columns
      // Bottom row: 2 equal columns
      const col5  = Math.floor((totalW - 2 * S) / 3);
      const col5b = Math.floor((totalW - S) / 2);
      const row5  = Math.floor((totalH - S) / 2);
      return [
        // top 3
        { left:0,              top:0,        width:col5,                  height:row5 },
        { left:col5 + S,       top:0,        width:col5,                  height:row5 },
        { left:2*(col5 + S),   top:0,        width:totalW - 2*(col5 + S), height:row5 },
        // bottom 2
        { left:0,              top:row5 + S, width:col5b,                 height:totalH - row5 - S },
        { left:col5b + S,      top:row5 + S, width:totalW - col5b - S,    height:totalH - row5 - S },
      ];

    default: return [];
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderSplitScreen() {
  const container = document.getElementById("splitScreen");
  const W = container.clientWidth;
  const H = container.clientHeight;
  container.innerHTML = "";

  const rects = getPaneRects(bagCount, W, H);

  for (let i = 0; i < bagCount; i++) {
    const bagId = i + 1;
    const r     = rects[i];
    container.appendChild(makeBagPane(bagId, r));
  }

  requestAnimationFrame(paintLoop);
}

function makeBagPane(bagId, rect) {
  const s    = bagState[bagId];
  const meta = BAG_META[bagId];

  const pane = document.createElement("div");
  pane.className  = "bag-pane" + (sessionActive ? " session-active" : "");
  pane.dataset.bag    = bagId;
  pane.dataset.bagid  = bagId;
  pane.style.left   = rect.left   + "px";
  pane.style.top    = rect.top    + "px";
  pane.style.width  = rect.width  + "px";
  pane.style.height = rect.height + "px";
  pane.onclick = (e) => {
    if (e.target.closest(".athlete-chip")) return;
    expandBag(bagId);
  };

  // Header
  const header = document.createElement("div");
  header.className = "pane-header";

  const dot = document.createElement("div");
  dot.className = "bag-dot";

  const label = document.createElement("div");
  label.className = "bag-label";
  label.textContent = meta.label;

  const liveDot = document.createElement("div");
  liveDot.className = "live-dot";
  liveDot.id = `liveDot-${bagId}`;
  liveDot.style.display = sessionActive ? "block" : "none";

  header.append(dot, label, liveDot, makeAthleteChip(bagId));

  // Stats
  const statStrip = document.createElement("div");
  statStrip.className = "stat-strip";
  statStrip.id = `stats-${bagId}`;
  statStrip.innerHTML = `
    <div class="stat-pill">
      <div class="stat-label">Hits</div>
      <div class="stat-value" id="stat-hits-${bagId}">${s.hits}</div>
    </div>
    <div class="stat-pill">
      <div class="stat-label">Events</div>
      <div class="stat-value" id="stat-events-${bagId}">${s.events}</div>
    </div>
    <div class="stat-pill">
      <div class="stat-label">Peak SI</div>
      <div class="stat-value" id="stat-si-${bagId}">${s.peakSi || "—"}</div>
    </div>
  `;

  // Matrix
  const matrixWrap = document.createElement("div");
  matrixWrap.className = "matrix-wrap";

  const hitGrid = document.createElement("div");
  hitGrid.className = "hit-grid";
  hitGrid.id = `grid-${bagId}`;

  for (let r = 0; r < NUM_ROWS; r++) {
    for (let c = 0; c < NUM_COLS; c++) {
      const cell = document.createElement("div");
      cell.className = "hit-cell";
      cell.id = `cell-${bagId}-${r}-${c}`;
      hitGrid.appendChild(cell);
    }
  }

  // Enlarge hint
  const enlargeBtn = document.createElement("div");
  enlargeBtn.className = "enlarge-btn";
  enlargeBtn.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none">
    <path d="M1 4V1h3M9 4V1H6M1 6v3h3M9 6v3H6" stroke="rgba(255,255,255,0.75)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

  matrixWrap.append(hitGrid, enlargeBtn);
  pane.append(header, statStrip, matrixWrap);
  return pane;
}

function makeAthleteChip(bagId) {
  const s    = bagState[bagId];
  const chip = document.createElement("div");
  chip.className = "athlete-chip" + (s.athlete ? " assigned" : "");
  chip.id = `chip-${bagId}`;
  chip.onclick = (e) => { e.stopPropagation(); openPicker(bagId); };

  if (s.athlete) {
    chip.innerHTML = `<div class="athlete-avatar">${s.athlete.initials}</div><span class="athlete-name">${s.athlete.name.split(" ")[0]}</span>`;
  } else {
    chip.innerHTML = `<span class="assign-icon">+</span><span class="athlete-name" style="color:var(--muted)">Assign</span>`;
  }
  return chip;
}

// ── Mode ──────────────────────────────────────────────────────────────────────
function setMode(mode) {
  if (sessionActive) return;
  currentMode = mode;
  document.querySelectorAll(".mode-chip").forEach(c => c.classList.toggle("active", c.dataset.mode === mode));
}

// ── Bag count ─────────────────────────────────────────────────────────────────
function setBagCount(n) {
  if (sessionActive) return;
  bagCount = n;
  document.querySelectorAll(".count-chip").forEach((c, i) => c.classList.toggle("active", i + 1 === n));
  renderSplitScreen();
}

// ── Session ───────────────────────────────────────────────────────────────────
function toggleSession() {
  sessionActive = !sessionActive;
  const btn = document.getElementById("globalBtn");

  if (sessionActive) {
    btn.className = "global-btn stop";
    btn.innerHTML = "<span>■</span> Stop All";
    for (let b = 1; b <= bagCount; b++) {
      bagState[b].hits = 0; bagState[b].events = 0;
      bagState[b].peakSi = 0; bagState[b].grid.clear();
    }
    startSimulation();
  } else {
    btn.className = "global-btn start";
    btn.innerHTML = "<span>▶</span> Start All";
    stopSimulation();
  }
  renderSplitScreen();
}

// ── Simulation ────────────────────────────────────────────────────────────────
function startSimulation() {
  for (let b = 1; b <= bagCount; b++) scheduleHit(b);
}

function stopSimulation() {
  simTimers.forEach(t => clearTimeout(t));
  simTimers = [];
}

function scheduleHit(bagId) {
  if (!sessionActive) return;
  const delay = 280 + Math.random() * 1600;
  const t = setTimeout(() => { fireHit(bagId); scheduleHit(bagId); }, delay);
  simTimers.push(t);
}

function fireHit(bagId) {
  if (!sessionActive) return;
  const s    = bagState[bagId];
  const meta = BAG_META[bagId];
  s.events++;

  const clusterSize = 3 + Math.floor(Math.random() * 6);
  const centerR = Math.floor(Math.random() * NUM_ROWS);
  const centerC = Math.floor(Math.random() * NUM_COLS);
  const now = Date.now();

  for (let i = 0; i < clusterSize; i++) {
    const r = Math.max(0, Math.min(NUM_ROWS - 1, centerR + Math.floor((Math.random() - 0.5) * 4)));
    const c = Math.max(0, Math.min(NUM_COLS - 1, centerC + Math.floor((Math.random() - 0.5) * 4)));
    s.grid.set(`${r},${c}`, { intensity: 0.4 + Math.random() * 0.6, ts: now });
  }
  s.hits += clusterSize;

  const si = Math.floor(200 + Math.random() * 800);
  if (si > s.peakSi) s.peakSi = si;

  const hEl = document.getElementById(`stat-hits-${bagId}`);
  const eEl = document.getElementById(`stat-events-${bagId}`);
  const sEl = document.getElementById(`stat-si-${bagId}`);
  if (hEl) hEl.textContent = s.hits;
  if (eEl) eEl.textContent = s.events;
  if (sEl) sEl.textContent = s.peakSi;

  if (expandedBag === bagId) updateExpandStats(bagId);
}

// ── Paint loop ────────────────────────────────────────────────────────────────
function paintLoop() {
  const now = Date.now();
  for (let b = 1; b <= bagCount; b++) {
    const s    = bagState[b];
    const meta = BAG_META[b];
    for (let r = 0; r < NUM_ROWS; r++) {
      for (let c = 0; c < NUM_COLS; c++) {
        const cellEl = document.getElementById(`cell-${b}-${r}-${c}`);
        if (!cellEl) continue;
        const hit  = s.grid.get(`${r},${c}`);
        if (hit) {
          const fade = Math.max(0, 1 - (now - hit.ts) / FADE_TTL);
          if (fade <= 0) {
            s.grid.delete(`${r},${c}`);
            cellEl.style.background  = "rgba(255,255,255,0.03)";
            cellEl.style.boxShadow   = "none";
          } else {
            cellEl.style.background  = hexAlpha(meta.color, fade * hit.intensity * 0.82);
            cellEl.style.boxShadow   = `0 0 5px 1px ${meta.glow.replace("0.55", (fade * 0.45).toFixed(2))}`;
          }
        }
        // Sync expand grid
        if (expandedBag === b) {
          const expCell = document.getElementById(`exp-${r}-${c}`);
          if (expCell) {
            const hit2  = s.grid.get(`${r},${c}`);
            if (hit2) {
              const fade2 = Math.max(0, 1 - (now - hit2.ts) / FADE_TTL);
              expCell.style.background = fade2 > 0 ? hexAlpha(meta.color, fade2 * hit2.intensity * 0.82) : "rgba(255,255,255,0.04)";
            } else {
              expCell.style.background = "rgba(255,255,255,0.04)";
            }
          }
        }
      }
    }
  }
  requestAnimationFrame(paintLoop);
}

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${Math.min(1, Math.max(0, alpha)).toFixed(2)})`;
}

// ── Athlete picker ────────────────────────────────────────────────────────────
function openPicker(bagId) {
  pickerTarget = bagId;
  const meta = BAG_META[bagId];
  document.getElementById("pickerTitle").textContent = `Assign Athlete — ${meta.label}`;

  const s = bagState[bagId];
  document.getElementById("unassignBtn").style.display = s.athlete ? "flex" : "none";

  const list = document.getElementById("pickerList");
  list.innerHTML = "";
  ATHLETES.forEach(a => {
    let elsewhere = null;
    for (let b = 1; b <= bagCount; b++) {
      if (b !== bagId && bagState[b].athlete?.id === a.id) elsewhere = b;
    }
    const row = document.createElement("div");
    row.className = "picker-row" + (s.athlete?.id === a.id ? " selected" : "");
    if (elsewhere) { row.style.opacity = "0.45"; row.style.pointerEvents = "none"; }
    row.innerHTML = `
      <div class="picker-avatar">${a.initials}</div>
      <div class="picker-info">
        <div class="picker-name">${a.name}</div>
        <div class="picker-meta">${a.meta}${elsewhere ? ` · Bag ${elsewhere}` : ""}</div>
      </div>
      <div class="picker-check">${s.athlete?.id === a.id ? "✓" : ""}</div>
    `;
    row.onclick = () => assignAthlete(bagId, a);
    list.appendChild(row);
  });
  document.getElementById("athletePicker").classList.add("open");
}

function assignAthlete(bagId, athlete) {
  bagState[bagId].athlete = athlete;
  closePicker();
  const chip = document.getElementById(`chip-${bagId}`);
  if (chip) {
    chip.className = "athlete-chip assigned";
    chip.innerHTML = `<div class="athlete-avatar">${athlete.initials}</div><span class="athlete-name">${athlete.name.split(" ")[0]}</span>`;
  }
}

function unassignAthlete() {
  if (pickerTarget !== null) {
    bagState[pickerTarget].athlete = null;
    const chip = document.getElementById(`chip-${pickerTarget}`);
    if (chip) {
      chip.className = "athlete-chip";
      chip.innerHTML = `<span class="assign-icon">+</span><span class="athlete-name" style="color:var(--muted)">Assign</span>`;
    }
  }
  closePicker();
}

function closePicker() {
  document.getElementById("athletePicker").classList.remove("open");
  pickerTarget = null;
}

function closePickerOnBackdrop(e) {
  if (e.target === document.getElementById("athletePicker")) closePicker();
}

// ── Expand overlay ────────────────────────────────────────────────────────────
function expandBag(bagId) {
  expandedBag = bagId;
  const s    = bagState[bagId];
  const meta = BAG_META[bagId];

  const dot = document.getElementById("expandDot");
  dot.style.background = meta.color;
  dot.style.boxShadow  = `0 0 8px 2px ${meta.glow}`;

  const title = document.getElementById("expandTitle");
  title.textContent = meta.label + (s.athlete ? ` · ${s.athlete.name}` : "");
  title.style.color  = meta.color;

  document.getElementById("expandLiveDot").style.display = sessionActive ? "block" : "none";

  updateExpandStats(bagId);

  const expGrid = document.getElementById("expandGrid");
  expGrid.innerHTML = "";
  for (let r = 0; r < NUM_ROWS; r++) {
    for (let c = 0; c < NUM_COLS; c++) {
      const cell = document.createElement("div");
      cell.className = "expand-cell";
      cell.id = `exp-${r}-${c}`;
      cell.style.background = "rgba(255,255,255,0.04)";
      cell.style.borderRadius = "4px";
      expGrid.appendChild(cell);
    }
  }

  const card = document.getElementById("expandCard");
  card.style.borderColor = meta.color + "44";
  card.style.boxShadow   = `0 0 40px -10px ${meta.glow}`;

  document.getElementById("expandOverlay").classList.add("open");
}

function updateExpandStats(bagId) {
  const s    = bagState[bagId];
  const meta = BAG_META[bagId];
  const el   = document.getElementById("expandStats");
  if (!el) return;
  el.innerHTML = `
    <div class="expand-stat"><div class="expand-stat-label">Hits</div><div class="expand-stat-val" style="color:${meta.color}">${s.hits}</div></div>
    <div class="expand-stat"><div class="expand-stat-label">Events</div><div class="expand-stat-val" style="color:${meta.color}">${s.events}</div></div>
    <div class="expand-stat"><div class="expand-stat-label">Peak SI</div><div class="expand-stat-val" style="color:${meta.color}">${s.peakSi || "—"}</div></div>
    <div class="expand-stat"><div class="expand-stat-label">Athlete</div><div class="expand-stat-val" style="color:#fff;font-size:13px">${s.athlete ? s.athlete.initials : "—"}</div></div>
  `;
}

function closeExpand() {
  document.getElementById("expandOverlay").classList.remove("open");
  expandedBag = null;
}

function closeExpandOnBackdrop(e) {
  if (e.target === document.getElementById("expandOverlay")) closeExpand();
}

// ── Re-layout on resize ───────────────────────────────────────────────────────
window.addEventListener("resize", () => {
  if (!sessionActive) renderSplitScreen();
});

// ── Init ──────────────────────────────────────────────────────────────────────
renderSplitScreen();
requestAnimationFrame(paintLoop);
</script>
</body>
</html>
